<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f8fb;
        }

        header {
            background: #087f8c;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #087f8c;
        }

        button {
            background: #087f8c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #055963;
        }

        .logout {
            background: white;
            color: #087f8c;
        }
    </style>
</head>

<body>

<header>
    <h2>🏥 Doctor Dashboard</h2>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <h1>Welcome, Doctor 👨‍⚕️</h1>
    <p>Manage your appointments and patient information.</p>

    <div class="cards">

        <div class="card">
            <h3>📅 Appointments</h3>
            <p>View today's appointments.</p>
            <button onclick="alert('Appointments will be displayed here')">
                View
            </button>
        </div>

        <div class="card">
            <h3>👤 Patients</h3>
            <p>View patient information.</p>
            <button onclick="alert('Patient list will be displayed here')">
                View
            </button>
        </div>

        <div class="card">
            <h3>💊 Prescriptions</h3>
            <p>Add and manage prescriptions.</p>
            <button onclick="alert('Prescription section will open here')">
                Manage
            </button>
        </div>

        <div class="card">
            <h3>🕒 Availability</h3>
            <p>Manage your available timings.</p>
            <button onclick="alert('Availability settings will open here')">
                Manage
            </button>
        </div>

    </div>

</div>

<script>
    function logout() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
